  <g fill="#dbeaf7" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18"><text x="890" y="125">DADOS</text><text x="1106" y="182">ROTINA</text><text x="890" y="239">AÇÃO</text></g>
